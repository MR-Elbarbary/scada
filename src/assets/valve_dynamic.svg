<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Main Outer Outlines and Shapes -->
  <g stroke="#070706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left Flange Plate -->
    <rect x="50" y="190" width="20" height="120" rx="4" fill="var(--fill, currentColor)" />
    <circle cx="60" cy="205" r="4" fill="#FDFDFE" />
    <circle cx="60" cy="295" r="4" fill="#FDFDFE" />

    <!-- Right Flange Plate -->
    <rect x="330" y="190" width="20" height="120" rx="4" fill="var(--fill, currentColor)" />
    <circle cx="340" cy="205" r="4" fill="#FDFDFE" />
    <circle cx="340" cy="295" r="4" fill="#FDFDFE" />

    <!-- Left Pipe Body Transition -->
    <polygon points="70,210 160,230 160,270 70,290" fill="var(--fill, currentColor)" />
    <line x1="85" y1="214" x2="85" y2="286" stroke="var(--stroke, currentColor)" stroke-width="4" />

    <!-- Right Pipe Body Transition -->
    <polygon points="330,210 240,230 240,270 330,290" fill="var(--fill, currentColor)" />
    <line x1="315" y1="214" x2="315" y2="286" stroke="var(--stroke, currentColor)" stroke-width="4" />

    <!-- Central Globe / Gate Valve Spherical Housing -->
    <circle cx="200" cy="250" r="50" fill="var(--fill, currentColor)" />
    <!-- Housing Shading Arc -->
    <path d="M 160 250 A 40 40 0 0 0 240 250" fill="none" stroke="var(--stroke, currentColor)" stroke-width="5" />

    <!-- Valve Bonnet/Stem Neck -->
    <rect x="185" y="140" width="30" height="60" fill="var(--fill, currentColor)" />
    <line x1="200" y1="140" x2="200" y2="200" stroke="var(--stroke, currentColor)" stroke-width="4" />

    <!-- Bonnet Packing Nut / Flange Collar -->
    <rect x="175" y="130" width="50" height="15" rx="3" fill="var(--fill, currentColor)" />
    <circle cx="183" cy="137" r="3" fill="#FDFDFE" />
    <circle cx="217" cy="137" r="3" fill="#FDFDFE" />

    <!-- Valve Actuator Stem Shaft -->
    <line x1="200" y1="130" x2="200" y2="85" stroke="#070706" stroke-width="8" />

    <!-- Top Handwheel Control Rim -->
    <circle cx="200" cy="70" r="35" fill="none" stroke="var(--fill, currentColor)" stroke-width="12" />
    <circle cx="200" cy="70" r="35" fill="none" stroke="#070706" stroke-width="6" />

    <!-- Handwheel Center Hub -->
    <circle cx="200" cy="70" r="10" fill="var(--fill, currentColor)" />
    <circle cx="200" cy="70" r="4" fill="#FDFDFE" />

    <!-- Handwheel Spokes -->
    <line x1="200" y1="35" x2="200" y2="60" stroke="var(--stroke, currentColor)" stroke-width="4" />
    <line x1="200" y1="80" x2="200" y2="105" stroke="var(--stroke, currentColor)" stroke-width="4" />
    <line x1="165" y1="70" x2="190" y2="70" stroke="var(--stroke, currentColor)" stroke-width="4" />
    <line x1="210" y1="70" x2="235" y2="70" stroke="var(--stroke, currentColor)" stroke-width="4" />
  </g>
</svg>
