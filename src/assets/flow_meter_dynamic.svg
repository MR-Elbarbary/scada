<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Outline Group -->
  <g stroke="#070706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left & Right Flanges -->
    <rect x="40" y="210" width="20" height="100" fill="var(--fill, currentColor)" />
    <rect x="340" y="210" width="20" height="100" fill="var(--fill, currentColor)" />

    <!-- Main Horizontal Pipe Body -->
    <rect x="60" y="230" width="280" height="60" fill="var(--fill, currentColor)" />
    
    <!-- Flange Detail Lines -->
    <line x1="80" y1="230" x2="80" y2="290" stroke="var(--stroke, currentColor)" stroke-width="4" />
    <line x1="320" y1="230" x2="320" y2="290" stroke="var(--stroke, currentColor)" stroke-width="4" />

    <!-- Flow Arrow -->
    <path d="M 160 260 L 220 260 L 220 250 L 240 260 L 220 270 L 220 260 Z" fill="var(--stroke, currentColor)" />

    <!-- Transmitter Neck -->
    <rect x="180" y="160" width="40" height="70" fill="var(--fill, currentColor)" />

    <!-- Display Housing (Transmitter Box) -->
    <rect x="140" y="60" width="120" height="100" rx="10" fill="var(--fill, currentColor)" />
    
    <!-- Digital Screen -->
    <rect x="160" y="80" width="80" height="50" rx="4" fill="#FDFDFE" stroke="var(--stroke, currentColor)" stroke-width="3" />

    <!-- Silver Flange Bolts -->
    <circle cx="50" cy="225" r="5" fill="#FDFDFE" />
    <circle cx="50" cy="295" r="5" fill="#FDFDFE" />
    <circle cx="350" cy="225" r="5" fill="#FDFDFE" />
    <circle cx="350" cy="295" r="5" fill="#FDFDFE" />
    
  </g>
</svg>
